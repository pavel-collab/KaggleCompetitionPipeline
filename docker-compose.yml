version: "3.8"

services:
  # ============================================================
  # PostgreSQL - хранение данных о соревнованиях
  # ============================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kaggle
      POSTGRES_PASSWORD: kaggle
      POSTGRES_DB: kaggle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaggle"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # RabbitMQ - очередь задач
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Scheduler - запускается по расписанию, создаёт задачи
  # Requires ~/.kaggle/kaggle.json on host machine
  # ============================================================
  scheduler:
    build: .
    command: python -m app.main scheduler
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - LOG_DIR=/app/logs
    volumes:
      - ~/.kaggle:/root/.kaggle:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================
  # Classify Worker - классифицирует соревнования через LLM
  # ============================================================
  classify-worker:
    build: .
    command: python -m app.main classify
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================
  # Notify Worker - отправляет уведомления в Telegram
  # ============================================================
  notify-worker:
    build: .
    command: python -m app.main notify
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_HOST=rabbitmq
      - LOG_DIR=/app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================
  # ML CLASSIFIER SERVICE - BERT-based text classifier
  # ============================================================
  classifier:
    build:
      context: ./mlops/classifier
      dockerfile: Dockerfile
    environment:
      - MODEL_PATH=/app/models/bert_classifier
      - SERVICE_NAME=classifier
      - LOG_LEVEL=INFO
      - DRIFT_DETECTOR_URL=http://drift-detector:8001
    volumes:
      - ./training/models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      - drift-detector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "logging=promtail"

  # ============================================================
  # DRIFT DETECTOR - monitors model quality and data drift
  # ============================================================
  drift-detector:
    build:
      context: ./mlops/drift_detector
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=drift-detector
      - LOG_LEVEL=INFO
      - WINDOW_SIZE=1000
      - REFERENCE_WINDOW_SIZE=5000
      - DRIFT_CHECK_INTERVAL=300
      - PSI_THRESHOLD=0.2
      - KS_THRESHOLD=0.05
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "logging=promtail"

  # ============================================================
  # PROMETHEUS - metrics collection
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./mlops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./mlops/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # LOKI - log aggregation
  # ============================================================
  loki:
    image: grafana/loki:2.9.2
    volumes:
      - ./mlops/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # PROMTAIL - log collector for Loki
  # ============================================================
  promtail:
    image: grafana/promtail:2.9.2
    volumes:
      - ./mlops/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ============================================================
  # GRAFANA - visualization and dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - ./mlops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:
