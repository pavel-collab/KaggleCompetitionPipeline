# Prometheus configuration for MLOps monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules
rule_files:
  - /etc/prometheus/alerts/*.yml

# Alert manager configuration (optional, can be added later)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Text Classifier service
  - job_name: 'classifier'
    static_configs:
      - targets: ['classifier:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Drift Detector service
  - job_name: 'drift-detector'
    static_configs:
      - targets: ['drift-detector:8001']
    metrics_path: /metrics
    scrape_interval: 30s

  # Docker container metrics (via cAdvisor)
  # Uncomment if you want container-level metrics
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
